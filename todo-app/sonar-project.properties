# SonarQube: รันจากโฟลเดอร์ todo-app หลังสร้างรายงาน coverage ด้วย `npm run test:ci`
sonar.projectKey=tamraidee
sonar.projectName=tamraidee
sonar.sourceEncoding=UTF-8

# โค้ดของแอป และไฟล์ทดสอบ (แยกกัน เพื่อไม่ให้ไฟล์ test ถูกนับเป็นโค้ดของแอป)
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,src/testing/**

# รายงาน coverage จาก Karma (lcov)
sonar.javascript.lcov.reportPaths=coverage/todo-app/lcov.info

sonar.exclusions=node_modules/**,dist/**,coverage/**,.angular/**,cypress/**,**/*.spec.ts,src/testing/**
