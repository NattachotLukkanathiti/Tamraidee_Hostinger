<main class="p">
  <button type="button" class="back-button"  (click)="back()" ><img src="image/back.svg" alt=""></button>
  <div class="con">
    <div class="page">
    <div class="page-heading">
    
    <h1>Profile</h1>
    <button  type="button" class="action-btn action-btn--edit edit-profile-button" (click)="edit()"><img src="image/edit.svg"  alt=""></button>
  </div>

  <div class="profile-card">
    <div class="profile-card__top">
      <img class="profile-avatar" [src]="profile" />
      <div class="pr">Role<span class="role">{{ userRole }}</span></div>
       <div class="phone">Phone
        <span class="profile-field__value">{{ phone }}</span>
      </div>
    </div>

    <div class="profile-grid">
      <div class="profile-field">Full Name<span class="profile-field__value">{{ username }}</span></div>
      <div class="profile-field">Date of Birth<span class="profile-field__value">{{dob}}</span></div>
      <div class="profile-field">National ID Number<span class="profile-field__value">{{nationnal}}</span></div>
    </div>

    <div class="profile-field">Current Address<span class="profile-field__value profile-field__value--area">{{address}}</span></div>
    <div class="profile-field">Emergency Contact<span class="profile-field__value profile-field__value--area">{{emergency}}</span></div>
  </div>
  </div>
  </div>
</main>
