<main class="p">
        <button type="button" class="back-button" aria-label="Back" (click)="back()"><img src="image/back.svg" alt=""></button>
  <div class="page">
    <div class="page-heading">
    <h1>Settings</h1>
  </div>

  <div class="settings-card">
    <section class="settings-section">
      <h2>Store profile</h2>
      <p>This information will appear on sales documents, reports, and the store's contact details.</p>

      <div class="settings-grid">
        <label class="settings-field">Email<span class="field"><input type="email" [(ngModel)]="form.email" /></span></label>
        <label class="settings-field">Phone number<span class="field"><input type="tel" [(ngModel)]="form.phone" /></span></label>
      </div>

      <label class="settings-field">Store address<span class="field field--area"><textarea rows="3" [(ngModel)]="form.address"></textarea></span></label>
    </section>

    <div class="settings-divider"></div>



    <div class="settings-actions">
      <button type="button" class="btn btn--secondary" (click)="back()">Cancel</button>
      <button type="button" class="btn btn--primary" (click)="save()">Save</button>
    </div>
  </div>
  </div>
</main>


    <div *ngIf="showpopupnoti" class="backpop">
        <div *ngIf="showpopupnoti" class="popupcontainer">
            <div class="popup-content">
                <img class="iconsuccess" src="image/cross.svg" alt="">
                <div class="headerpop">
                    Something went Wrong
                </div>
                <div class="subheadersuccess">
                    {{popup}}
                </div>
                <button class="buttonnoti" (click)="closepopup()">OK</button>
            </div>
        </div>
    </div>
<div *ngIf="showpopup" class="backpop">
  <div *ngIf="showpopup" class="popupcontainer">
  <div class="popup-content">
    <img class="iconsuccess" src="image/success.svg" alt="">
    <div class="headerpop">
      Success
    </div>
    <div class="subheadersuccess">
      {{popup}}
    </div>
    <button class="buttonclose" (click)="closepopup()">Back to Inventory</button>
  </div>
</div>
</div>

</div>
