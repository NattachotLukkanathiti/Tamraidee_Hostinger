<div class="pm-switch">
  <div class="pm-brand">Phumalin</div>
  <div class="pm-stores" role="radiogroup" aria-label="เลือกร้าน">
    @for (store of stores; track store.id) {
      <button type="button" role="radio" class="pm-store"
        [class.pm-store--active]="state.store() === store.id"
        [attr.aria-checked]="state.store() === store.id"
        (click)="state.setStore(store.id)">{{ store.label }}</button>
    }
  </div>
</div>
