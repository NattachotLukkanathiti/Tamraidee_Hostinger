<div class="hero">
   <div class="con_input">
    <div class="input-group">
      <input type="text" placeholder="" [(ngModel)]="username">
      <label for="">Username</label>
      <img src="image/Vector.svg" class="iconpass" alt="">
  </div>
  <div class="input-group">
      <input type="text" placeholder="" [(ngModel)]="title">
      <label for="">Email</label>
          <img src="image/Email.svg" class="iconpass" alt="">
  </div>
   </div>
   <div class="input-group">
      <input placeholder="" [type]="showPassword ? 'text': 'password'" [(ngModel)]="password">
      <label for="">Password</label>
      <img class="iconpass"  (click)="togglePasswordVisibility()" [src]="showPassword ? 'image/eye-open.svg' : 'image/eye-off.svg'">
  </div>
   <div class="input-group">
      <input placeholder="" [type]="showConfirmPassword ? 'text': 'password'" [(ngModel)]="confirmPassword" >
      <label for="">Confirm Password</label>
      <img class="iconpass" (click)="toggleConfirmPassword()" [src]="showConfirmPassword ? 'image/eye-open.svg' : 'image/eye-off.svg'">
  </div>
  
  <div class="checkbox-group">
      <mat-checkbox class="re" id="rememberMe" [(ngModel)]="rememberMe">I agree to the</mat-checkbox>
      <div class="For">Terms & Privacy</div>
</div>

  <div class="sihg">
       <button class="button" (click)="addTodo()" [disabled]="loading">Continue</button>
  </div>
   <div class="or">OR</div> 
    <div class="con_help">
      
   <div class="internet">
  <button class="Facebook" (click)="signInWithFacebook()">
    <img class="icon" src="image/facebook.svg" alt="Facebook">
  </button>
  <button class="Google" (click)="signInWithGoogle()">
    <img class="icon" src="image/google.svg" alt="Google">
  </button>
  <button class="Apple"  (click)="signInWithGitHub()">
    <img class="icon" src="image/github.png" alt="Apple">
  </button>
</div>
  </div>

<div *ngIf="showpopup" class="backpop">
  <div *ngIf="showpopup" class="popupcontainer">
  <div class="popup-content">
    <img class="iconsuccess" src="image/success.svg" alt="">
    <div class="headerpop">
      {{popup}}
    </div>
    <div class="subheadersuccess">
      Your register completed
    </div>
    <button class="buttonclose" (click)="closepopup()">Back to Sign In</button>
  </div>
</div>
</div>

<div *ngIf="showpopupnoti" class="backpop">
  <div *ngIf="showpopupnoti" class="popupcontainer">
  <div class="popup-content">
    <img class="iconsuccess" src="image/cross.svg" alt="">
    <div class="headerpop">
      Something went Wrong
    </div>
    <div class="subheadersuccess">
      {{popup}}
    </div>
    <button class="buttonnoti" (click)="closepopup()">OK</button>
  </div>
</div>
</div>


<div *ngIf="isLoading" class="loading-container">
    <img class="logo_loading" src="/image/logoo.svg" alt="" >
  <div class="loading">
    <div class="loader1"></div>
    <div class="loader2"></div>
    <div class="loader3"></div>
    <div class="loader4"></div>
  </div>
</div>
